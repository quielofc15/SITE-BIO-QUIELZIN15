<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link na Bio | QUIELZIN15</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="loading">
  <div id="preloader">
    <div class="loader-background"></div>
    <div class="loader-particles"></div>

    <div class="loader-content">
      <div class="loader-ring">
        <div class="loader-ring-highlight"></div>
        <div class="loader-logo"></div>
      </div>

      <div class="loader-title">SISTEMA QUIELZIN15</div>
      <div id="loaderStatus">[1/5] Inicializando sistema...</div>

      <div class="loader-progress">
        <div class="progress-track">
          <div id="loaderProgressFill" class="progress-fill"></div>
        </div>
      </div>

      <div id="loaderPercent">0%</div>
      <div id="loaderConsole">SYSTEM STATUS</div>
    </div>
  </div>

  <div class="page-shell">
    <canvas id="particle-canvas"></canvas>

    <main class="content-wrapper">
      <section class="hero-card glass-card">
        <div class="hero-title neon-text">🤍 AMO A LORENA 🤍</div>
        <div class="hero-subtitle">DESENVOLVIDO POR <span>@QUIELZIN15</span></div>
        <div class="hero-meta">INSTA: <a href="https://www.instagram.com/quielzin15/" target="_blank" rel="noopener noreferrer">QUIELZIN15</a></div>
      </section>

      <!-- Visit counter (placed exactly between header and first button) -->
      <section class="visit-counter" aria-label="contador de visitas">
        <div class="visit-counter-inner">👁️ <span id="visitCount">0</span> VISITAS</div>
      </section>

      <section class="links-grid">
        <a class="link-button glass-button" href="https://www.instagram.com/lorena._aline_/" target="_blank" rel="noopener noreferrer">
          <span class="button-icon">📸</span>
          <span>INSTA LORENA</span>
        </a>

        <a class="link-button glass-button" href="https://www.instagram.com/quielzin15/" target="_blank" rel="noopener noreferrer">
          <span class="button-icon">📸</span>
          <span>INSTA QUIELZIN15</span>
        </a>

        <a class="link-button glass-button" href="https://www.tiktok.com/@quielzin15" target="_blank" rel="noopener noreferrer">
          <span class="button-icon">🎵</span>
          <span>TIKTOK QUIELZIN15</span>
        </a>

        <a class="link-button glass-button" href="https://discord.gg/vortexxx" target="_blank" rel="noopener noreferrer">
          <span class="button-icon">💬</span>
          <span>DISCORD DO QUIEL</span>
        </a>
      </section>

      <!-- Image section: two images stacked, titles centered above each -->
      <section class="images-section">
        <div class="image-card">
          <h3 class="image-title">2 X 2 SO CAPA</h3>
          <div class="image-wrap">
            <img src="assets/2%20X%202%20SO%20CAPA.png" alt="2 X 2 SO CAPA" loading="lazy" />
          </div>
        </div>

        <div class="image-card">
          <h3 class="image-title">4 VS 4 BERMUDA</h3>
          <div class="image-wrap">
            <img src="assets/4%20VS%204%20BERMUDA.png" alt="4 VS 4 BERMUDA" loading="lazy" />
          </div>
        </div>
      </section>

      <footer class="site-footer">
        <p>🤍 QUIELZIN15 E LORENA PARA SEMPRE 🤍</p>
      </footer>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/visits.js"></script>
</body>
</html>
