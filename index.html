<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Link na Bio | QUIELZIN15</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="loading">

  <!-- =====================================================
       TELA DE CARREGAMENTO
       ===================================================== -->

  <div id="preloader">

    <div class="loader-background"></div>

    <div class="loader-particles"></div>

    <div class="loader-content">

      <div class="loader-ring">
        <div class="loader-ring-highlight"></div>
        <div class="loader-logo"></div>
      </div>

      <div class="loader-title">
        SISTEMA QUIELZIN15
      </div>

      <div id="loaderStatus">
        [1/5] Inicializando sistema...
      </div>

      <div class="loader-progress">
        <div class="progress-track">
          <div
            id="loaderProgressFill"
            class="progress-fill"
          ></div>
        </div>
      </div>

      <div id="loaderPercent">
        0%
      </div>

      <div id="loaderConsole">
        SYSTEM STATUS
      </div>

    </div>
  </div>


  <!-- =====================================================
       SITE PRINCIPAL
       ===================================================== -->

  <div class="page-shell">

    <canvas id="particle-canvas"></canvas>

    <main class="content-wrapper">

      <!-- =================================================
           CABEÇALHO
           ================================================= -->

      <section class="hero-card glass-card">

        <div class="hero-title neon-text">
          🤍 AMO A LORENA 🤍
        </div>

        <div class="hero-subtitle">
          DESENVOLVIDO POR
          <span>@QUIELZIN15</span>
        </div>

        <div class="hero-meta">
          INSTA:
          <a
            href="https://www.instagram.com/quielzin15/"
            target="_blank"
            rel="noopener noreferrer"
          >
            QUIELZIN15
          </a>
        </div>

      </section>


      <!-- =================================================
           CONTADOR DE VISITAS
           ================================================= -->

      <section
        class="visit-counter"
        aria-label="contador de visitas"
      >

        <div class="visit-counter-inner">

          <span class="visit-icon">
            👁️
          </span>

          <span>
            VISITAS:
          </span>

          <strong id="visitCount">
            CARREGANDO...
          </strong>

        </div>

      </section>


      <!-- =================================================
           BOTÕES
           ================================================= -->

      <section class="links-grid">

        <!-- INSTAGRAM LORENA -->

        <a
          class="link-button glass-button"
          href="https://www.instagram.com/lorena._aline_/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="button-icon">
            📸
          </span>

          <span>
            INSTA LORENA
          </span>

        </a>


        <!-- INSTAGRAM QUIELZIN15 -->

        <a
          class="link-button glass-button"
          href="https://www.instagram.com/quielzin15/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="button-icon">
            📸
          </span>

          <span>
            INSTA QUIELZIN15
          </span>

        </a>


        <!-- TIKTOK -->

        <a
          class="link-button glass-button"
          href="https://www.tiktok.com/@quielzin15"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="button-icon">
            🎵
          </span>

          <span>
            TIKTOK QUIELZIN15
          </span>

        </a>


        <!-- DISCORD -->

        <a
          class="link-button glass-button"
          href="https://discord.gg/vortexxx"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span class="button-icon">
            💬
          </span>

          <span>
            DISCORD DO QUIEL
          </span>

        </a>

      </section>


      <!-- =================================================
           IMAGENS
           ================================================= -->

      <section class="images-section">

        <!-- 2 X 2 SO CAPA -->

        <div class="image-card">

          <h3 class="image-title">
            2 X 2 SO CAPA
          </h3>

          <div class="image-wrap">

            <img
              src="assets/2%20X%202%20SO%20CAPA.png"
              alt="2 X 2 SO CAPA"
              loading="lazy"
            />

          </div>

        </div>


        <!-- 4 VS 4 BERMUDA -->

        <div class="image-card">

          <h3 class="image-title">
            4 VS 4 BERMUDA
          </h3>

          <div class="image-wrap">

            <img
              src="assets/4%20VS%204%20BERMUDA.png"
              alt="4 VS 4 BERMUDA"
              loading="lazy"
            />

          </div>

        </div>

      </section>


      <!-- =================================================
           RODAPÉ
           ================================================= -->

      <footer class="site-footer">

        <p>
          🤍 QUIELZIN15 E LORENA PARA SEMPRE 🤍
        </p>

      </footer>


    </main>
  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="js/app.js"></script>

</body>
</html>
